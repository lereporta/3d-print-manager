<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}3D Print Manager{% endblock %}</title>

    <!-- FOUC FIX -->
    <script>
        (function() {
            var t = localStorage.getItem('theme');
            if (t === 'dark' || (!t && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.documentElement.classList.add('dark');
            } else {
                document.documentElement.classList.remove('dark');
            }
        })();
    </script>
    <style>
        html.dark { background-color: #0f172a; color: #e2e8f0; }
        html:not(.dark) { background-color: #f8fafc; color: #0f172a; }
    </style>

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/custom.css">
    
    <!-- Auth Guard (Carregado antes de qualquer fetch) -->
    <script src="/static/js/auth-guard.js"></script>
</head>
<body class="font-['Inter'] bg-slate-900 text-slate-100 no-transitions">

    <div id="sidebar-overlay" class="hidden fixed inset-0 bg-black/40 z-40 lg:hidden"></div>

    <!-- Sidebar -->
    <aside id="sidebar" class="sidebar flex flex-col">
        <div class="p-5 pb-3">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-indigo-500 to-cyan-400 flex items-center justify-center shadow-lg">
                    <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                              d="M14 10l-2 1m0 0l-2-1m2 1v2.5M20 7l-2 1m2-1l-2-1m2 1v2.5M14 4l-2-1-2 1M4 7l2-1M4 7l2 1M4 7v2.5M12 21l-2-1m2 1l2-1m-2 1v-2.5M6 18l-2-1v-2.5M18 18l2-1v-2.5"/>
                    </svg>
                </div>
                <div>
                    <h1 class="font-extrabold text-lg leading-none">3D Print</h1>
                    <span class="text-xs text-indigo-500 font-semibold tracking-wider uppercase">Manager</span>
                </div>
            </div>
        </div>

        <nav class="flex-1 px-3 mt-2 space-y-1">
            <span class="block px-3 py-2 text-xs font-bold uppercase tracking-wider text-gray-400">Menu</span>
            <a href="/" class="nav-item {% if active_page == 'dashboard' %}active{% endif %}">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/></svg>
                Dashboard
            </a>
            <a href="/history/" class="nav-item {% if active_page == 'history' %}active{% endif %}">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                Histórico
            </a>
            <a href="/queue/" class="nav-item {% if active_page == 'queue' %}active{% endif %}">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/></svg>
                Fila de Impressão
            </a>

            <span class="block px-3 pt-4 pb-2 text-xs font-bold uppercase tracking-wider text-gray-400">Gestão</span>
            <a href="/inventory/" class="nav-item {% if active_page == 'inventory' %}active{% endif %}">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"/></svg>
                Inventário
            </a>

            <!-- Dentro de <nav>, após "Gestão" -->
            <div id="admin-nav-section" style="display:none;">
                <span class="block px-3 pt-4 pb-2 text-xs font-bold uppercase tracking-wider text-amber-500">Administração</span>
                <a href="/admin" class="nav-item {% if active_page == 'admin' %}active{% endif %}">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
                    </svg>
                    Painel Admin
                </a>
            </div>

            <!-- Logout -->
            <a href="#" onclick="logout(); return false;" class="nav-item text-red-500">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>
                Sair
            </a>
        </nav>

        <!-- Theme Toggle -->
        <div class="p-4 border-t border-gray-200 dark:border-gray-700">
            <div class="flex items-center justify-between">
                <div class="flex items-center gap-2">
                    <svg class="w-4 h-4 text-yellow-500" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2.25a.75.75 0 01.75.75v2.25a.75.75 0 01-1.5 0V3a.75.75 0 01.75-.75zM7.5 12a4.5 4.5 0 119 0 4.5 4.5 0 01-9 0z"/></svg>
                    <span class="text-xs font-medium text-gray-500">Tema</span>
                    <svg class="w-4 h-4 text-indigo-400" fill="currentColor" viewBox="0 0 24 24"><path d="M9.528 1.718a.75.75 0 01.162.819A8.97 8.97 0 009 6a9 9 0 009 9 8.97 8.97 0 003.463-.69.75.75 0 01.981.98 10.503 10.503 0 01-9.694 6.46c-5.799 0-10.5-4.701-10.5-10.5 0-4.368 2.667-8.112 6.46-9.694a.75.75 0 01.818.162z"/></svg>
                </div>
                <div class="theme-toggle theme-switch" role="button" aria-label="Alternar tema"></div>
            </div>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
        <header class="sticky top-0 z-30 backdrop-blur-lg bg-white/70 dark:bg-slate-900/70 border-b border-gray-200 dark:border-gray-800 px-4 sm:px-6 py-3 transition-colors duration-200">
            <div class="flex items-center justify-between">
                <div class="flex items-center gap-3">
                    <button id="mobile-menu-btn" class="mobile-menu-btn p-2 rounded-lg hover:bg-gray-100 dark:hover:bg-slate-800">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg>
                    </button>
                    <h2 class="text-lg sm:text-xl font-bold">{% block page_title %}Dashboard{% endblock %}</h2>
                </div>
                <div class="flex items-center gap-3">
                    <span class="hidden sm:block text-xs text-gray-400 font-mono" id="current-time"></span>
                    <div class="w-8 h-8 rounded-full bg-gradient-to-br from-indigo-500 to-purple-600 flex items-center justify-center text-white text-xs font-bold">W</div>
                </div>
            </div>
        </header>

        <div class="p-4 sm:p-6 lg:p-8">
            {% block content %}{% endblock %}
        </div>
    </main>

    <script src="/static/js/app.js"></script>
    <script>
        function updateClock() {
            const el = document.getElementById('current-time');
            if (el) el.textContent = new Date().toLocaleString('pt-BR', { day:'2-digit', month:'2-digit', year:'numeric', hour:'2-digit', minute:'2-digit' });
        }
        updateClock();
        setInterval(updateClock, 30000);
    </script>
    {% block scripts %}{% endblock %}

    <!-- Scripts de Feedback, Admin e Avatar -->
    <script src="/static/js/feedback-widget.js"></script>
    <script>
      // Mostra link admin se o usuário for admin
      if (window.__USER__?.is_admin) {
          const sec = document.getElementById('admin-nav-section');
          if (sec) sec.style.display = '';
      }
      // Atualiza inicial do usuário no header
      const avatar = document.querySelector('header .rounded-full');
      if (avatar && window.__USER__?.name) {
          avatar.textContent = window.__USER__.name.charAt(0).toUpperCase();
          avatar.title = window.__USER__.name;
      }
    </script>
</body>
</html>
